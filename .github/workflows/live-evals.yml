name: live-evals

# Runs the eval suite against a real model on Amazon Bedrock. It costs money and its results
# vary, so it runs on demand and once a week, not on every push. Setup: docs/live-evals.md.
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Bedrock model ID for the agent
        required: true
        default: amazon.nova-lite-v1:0
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: live-evals
  cancel-in-progress: false

jobs:
  live:
    # Skipped until the repository variable AWS_EVALS_ROLE_ARN points at a role (see docs).
    if: vars.AWS_EVALS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # GitHub OIDC, so no long-lived AWS keys live in the repo
    env:
      EVAL_MODE: live
      EVAL_MODEL_ID: ${{ inputs.model_id || vars.EVAL_MODEL_ID || 'amazon.nova-lite-v1:0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EVALS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: npm run evals
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report-live
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
