name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run that's now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs. Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail on known high or critical vulnerabilities in code that ships to Lambda.
      - run: npm audit --omit=dev --audit-level=high
      # Type check, lint, unit + infra tests, the stub eval suite with its gate, then synth with cdk-nag.
      # The eval step writes its report to the job summary.
      - run: npm run check
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report-stub
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
